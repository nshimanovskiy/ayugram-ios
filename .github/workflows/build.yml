name: Build unsigned IPA

# Builds an unsigned AyuGram IPA with the fake codesigning identities that ship with the
# Telegram-iOS sources. Sign it on install with Sideloadly or AltStore.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   TELEGRAM_API_ID    - api_id from https://my.telegram.org/apps
#   TELEGRAM_API_HASH  - api_hash from the same page
# Without them the build falls back to the official Telegram iOS key from
# build-system/appstore-configuration.json. Telegram's API terms ask third-party clients to
# use their own key, so set the secrets as soon as you have one.

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360

    env:
      # Source paths end up in the binary, so keep them stable across builds.
      SOURCE_DIR: /Users/Shared/ayugram-ios
      BAZEL_USER_ROOT: /private/var/tmp/_bazel_ayugram
      BAZEL_CACHE_DIR: /Users/Shared/ayugram-bazel-cache

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: |
          WANTED=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          if [ -d "/Applications/Xcode_$WANTED.app" ]; then
            XCODE="/Applications/Xcode_$WANTED.app"
          else
            XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
            echo "::warning::Xcode $WANTED is not installed on the runner, using $XCODE"
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Free disk space
        run: |
          CURRENT=$(xcode-select -p | sed 's#/Contents/Developer##')
          for app in /Applications/Xcode*.app; do
            [ "$app" = "$CURRENT" ] || [ "$app" = /Applications/Xcode.app ] || sudo rm -rf "$app" &
          done
          sudo rm -rf "$HOME/Library/Android" /usr/local/share/dotnet "$HOME/.dotnet" &
          wait
          # Some third-party build scripts (dav1d's iOS crossfile) hardcode
          # /Applications/Xcode.app, so point it at the selected Xcode.
          if [ "$CURRENT" != /Applications/Xcode.app ]; then
            sudo rm -rf /Applications/Xcode.app
            sudo ln -s "$CURRENT" /Applications/Xcode.app
          fi
          ls -la /Applications | grep -i xcode
          df -h /

      - name: Create canonical source directory
        run: |
          # /Users/Shared is world-writable on macOS.
          mkdir -p "$BAZEL_CACHE_DIR"
          cp -R "$GITHUB_WORKSPACE" "$SOURCE_DIR"

      - name: Write build configuration
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          # Bundle and team IDs must match the fake provisioning profiles; the signing tool
          # replaces them on install anyway.
          cd "$SOURCE_DIR"
          python3 - <<'EOF'
          import json, os
          with open("build-system/appstore-configuration.json") as f:
              config = json.load(f)
          api_id = os.environ.get("TELEGRAM_API_ID", "")
          api_hash = os.environ.get("TELEGRAM_API_HASH", "")
          if api_id and api_hash:
              config["api_id"] = api_id
              config["api_hash"] = api_hash
          else:
              print("::warning::TELEGRAM_API_ID/TELEGRAM_API_HASH are not set, "
                    "building with the official Telegram iOS key.")
          with open("build-system/ayugram-configuration.json", "w") as f:
              json.dump(config, f, indent=4)
          EOF

      - name: Restore Bazel cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BAZEL_CACHE_DIR }}
          key: bazel-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Build
        run: |
          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          BUILD_NUMBER="$(($(git rev-list --count HEAD) + BUILD_NUMBER_OFFSET))"
          APP_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["app"])')
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$BAZEL_CACHE_DIR" \
            build \
            --configurationPath=build-system/ayugram-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

      - name: Collect IPA
        run: |
          cd "$SOURCE_DIR"
          mkdir -p "$GITHUB_WORKSPACE/out"
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
            cp "$f" "$GITHUB_WORKSPACE/out/AyuGram-$APP_VERSION-$BUILD_NUMBER.ipa"
          done
          ls -lh "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        with:
          name: AyuGram-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: out/*.ipa
          if-no-files-found: error
